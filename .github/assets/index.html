<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Opencast editor test deployments</title>
<link rel="icon" href="develop/favicon.ico" />
<style>
:root {
  --header: linear-gradient(to bottom, #388ed6, #2075b1);
  --page-bg: #eef1f4;
  --card-bg: #ffffff;
  --text: #1a1f24;
  --text-muted: #55606b;
  --label: #6b7681;
  --shadow: 0 1px 3px rgba(0, 0, 0, .1), 0 8px 30px rgba(0, 0, 0, .07);
  --item-bg: #ffffff;
  --item-border: #d3dae0;
  --item-hover-bg: #f2f5f8;
  --item-hover-border: #2075b1;
}

@media (prefers-color-scheme: dark) {
  :root {
    --page-bg: #14181c;
    --card-bg: #1d2329;
    --text: #eef1f4;
    --text-muted: #a8b3bd;
    --label: #8d99a4;
    --shadow: 0 1px 3px rgba(0, 0, 0, .4), 0 8px 30px rgba(0, 0, 0, .3);
    --item-bg: #262e35;
    --item-border: #3a444d;
    --item-hover-bg: #2f3841;
    --item-hover-border: #4ba3e3;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px;
  min-height: 100vh;
  background: var(--page-bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
  line-height: 1.6;
}

.card {
  max-width: 1100px;
  margin: 0 auto;
  overflow: hidden;
  border-radius: 8px;
  background: var(--card-bg);
  box-shadow: var(--shadow);
}

header {
  padding: 15px 32px;
  background: var(--header);
}

header > svg {
  display: block;
  width: 150px;
  height: auto;
  color: #fff;
}

main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  padding: 64px 32px;
}

h1 {
  margin: 0 0 24px;
  font-size: 2.2rem;
  line-height: 1.2;
}

p {
  margin: 0 0 16px;
  max-width: 42ch;
  color: var(--text-muted);
}

p:last-child {
  margin-bottom: 0;
}

h2 {
  margin: 0 0 16px;
  color: var(--label);
  font-size: .8rem;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.versions {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 16px;
}

.versions > a {
  padding: 14px 10px;
  border: 1px solid var(--item-border);
  border-radius: 6px;
  background: var(--item-bg);
  color: var(--text);
  font-size: 1.1rem;
  text-align: center;
  text-decoration: none;
  transition: background .1s, border-color .1s;
}

.versions > a:hover,
.versions > a:focus-visible {
  border-color: var(--item-hover-border);
  background: var(--item-hover-bg);
}

@media (max-width: 800px) {
  body {
    padding: 0;
  }

  .card {
    border-radius: 0;
  }

  main {
    grid-template-columns: 1fr;
    gap: 40px;
    padding: 40px 24px;
  }

  h1 {
    font-size: 1.8rem;
  }
}
</style>
</head>
